manifestVersion: "1"
id: claude-code
name: Claude Code
version: 1.0.0
type: plugin
trusted: true
description: AI-assisted development in terminal
author: SessionNode
homepage: https://github.com/anthropics/claude-code
license: MIT

core:
  permissions:
    - id: claude-code.session
      description: Manage Claude Code sessions
      capabilities:
        - session.create
        - session.list
        - session.destroy
      default: ask
      constraints:
        paths:
          allow:
            - "${workspace}/**"
          deny:
            - "**/.env"

    - id: claude-code.files
      description: Read and write workspace files
      capabilities:
        - fs.read
        - fs.write
        - fs.list
        - fs.stat
      default: ask
      constraints:
        paths:
          allow:
            - "${workspace}/**"
            - "~/.claude/**"
          deny:
            - "**/.env"
            - "**/node_modules/**"

    - id: claude-code.process
      description: Run claude binary
      capabilities:
        - process.spawn
      default: ask
      constraints:
        paths:
          allow:
            - "${workspace}/**"

    - id: claude-code.config
      description: Read plugin configuration
      capabilities:
        - config.get
      default: allow

    - id: claude-code.notify
      description: Send notifications and approval requests
      capabilities:
        - notify.send
        - notify.request
      default: ask

    - id: claude-code.network
      description: Network connectivity for Claude Code API calls
      capabilities:
        - network.connect
        - network.dns
      default: ask
      constraints:
        network:
          hosts:
            - api.anthropic.com
            - "*.anthropic.com"
          ports:
            - 443
          schemes:
            - https

    - id: claude-code.network-fetch
      description: Core-managed HTTP fetch (planned, not implemented yet)
      capabilities:
        - network.fetch
      default: deny

  environment:
    checks:
      - id: claude-binary
        type: binary
        required: true
        command: claude
        versionCommand: claude --version
        requiredVersion: ">= 0.20.0"
        installHint: "npm install -g @anthropic-ai/claude-code"

      - id: git-binary
        type: binary
        required: false
        command: git
        versionCommand: git --version

  files:
    config: "${plugin.dir}/config"
    data: "${plugin.dir}/data"
    cache: "${plugin.dir}/cache"
    logs: "${plugin.dir}/logs"
    artifacts: "${plugin.dir}/artifacts"
    declarations:
      - id: claude-global-history
        path: "~/.claude/history.jsonl"
        description: Claude Code global session history
        clearable: false
        external: true

      - id: claude-cache
        path: "${plugin.cacheDir}/models"
        description: Claude model metadata cache
        clearable: true

  tasks:
    - id: claude-code.install
      capability: plugin.install.execute
      planRequired: true
      risk: medium

    - id: claude-code.clear-cache
      capability: plugin.cache.clear.execute
      planRequired: true
      risk: low

  history:
    defaultPolicy: memory

adapters:
  system-ui:
    views:
      - id: claude-code.chat
        surface: main.editor
        type: custom-react
        entry: ./web/ClaudeChatView.tsx
        title: Claude Chat
        icon: sparkles

    panels:
      - id: claude-code.panel
        surface: main.editor.bottom
        type: custom-react
        entry: ./web/ClaudeCodePanel.tsx
        title: Claude Code

    commands:
      - id: claude-code.start
        title: Start Claude Code
        command: claude-code.start

      - id: claude-code.history
        title: Show History
        command: claude-code.history

    status:
      - id: claude-code.status
        label: Claude Code
        icon: bot
        command: claude-code.start

  cli:
    commands:
      - id: claude-code.cli.start
        name: start
        description: Start Claude Code session
        entry: ./cli/index.ts
        handler: startHandler
        permissions:
          - claude-code.session
        args: "[dir] [--target <node>]"
        examples:
          - "node claude start /repo"
          - "node claude start --target vps"

      - id: claude-code.cli.history
        name: history
        description: Show Claude Code session history
        entry: ./cli/index.ts
        handler: historyHandler

      - id: claude-code.cli.status
        name: status
        description: Show Claude Code status
        entry: ./cli/index.ts
        handler: statusHandler

      - id: claude-code.cli.resume
        name: resume
        description: Resume a Claude Code session
        entry: ./cli/index.ts
        handler: resumeHandler
        permissions:
          - claude-code.session
        args: "<session-id>"
