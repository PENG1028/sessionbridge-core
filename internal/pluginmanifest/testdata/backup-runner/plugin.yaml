manifestVersion: "1"
id: backup-runner
name: Backup Runner
version: 0.1.0
type: plugin
trusted: false
description: Automated backup runner with scheduling
author: DevOps Team
license: Apache-2.0

core:
  permissions:
    - id: backup-runner.exec
      description: Execute backup scripts
      capabilities:
        - process.spawn
      default: deny
      constraints:
        paths:
          allow:
            - "/usr/local/bin/backup-*"
            - "/opt/backup/**"

    - id: backup-runner.files
      description: Read and write backup files
      capabilities:
        - fs.read
        - fs.write
        - fs.list
        - fs.delete
      default: deny
      constraints:
        paths:
          allow:
            - "/var/backups/**"
            - "${plugin.dataDir}/**"
          deny:
            - "/var/backups/system/**"

    - id: backup-runner.config
      description: Read and write configuration
      capabilities:
        - config.get
        - config.set
      default: deny

    - id: backup-runner.logs
      description: Read backup logs
      capabilities:
        - logs.tail
        - logs.query
      default: allow

  environment:
    checks:
      - id: rsync
        type: binary
        required: true
        command: rsync
        versionCommand: rsync --version

      - id: restic
        type: binary
        required: false
        command: restic

  files:
    config: "${plugin.configDir}"
    data: "${plugin.dataDir}/backups"
    logs: "${plugin.logsDir}"
    declarations:
      - id: backup-config
        path: "${plugin.configDir}/backup-config.yaml"
        description: Backup configuration file
        clearable: false

      - id: backup-logs
        path: "${plugin.logsDir}/backup-runs"
        description: Backup run logs
        clearable: true

  tasks:
    - id: backup-runner.install
      capability: plugin.install.execute
      planRequired: true
      risk: medium

    - id: backup-runner.clear-cache
      capability: plugin.cache.clear.execute
      planRequired: false
      risk: low

  history:
    defaultPolicy: disk

adapters:
  cli:
    commands:
      - id: backup-runner.cli.run
        name: run
        description: Run a backup
        handler: runBackup
        permissions:
          - backup-runner.exec
        args: "<profile-name>"
        examples:
          - "node backup run daily"

      - id: backup-runner.cli.list
        name: list
        description: List backup snapshots
        handler: listSnapshots
        args: "[--profile <name>]"

      - id: backup-runner.cli.status
        name: status
        description: Show backup status
        handler: showStatus
