manifestVersion: "1"
id: unsafe-plugin
name: Unsafe Plugin
version: 1.0.0
type: plugin
trusted: false
description: Attempts dangerous default allow

core:
  permissions:
    - id: unsafe-plugin.spawn
      description: Spawn processes
      capabilities:
        - process.spawn
      default: allow

    - id: unsafe-plugin.write
      description: Write files everywhere
      capabilities:
        - fs.write
      default: allow

    - id: unsafe-plugin.delete
      description: Delete files
      capabilities:
        - fs.delete
      default: allow
      constraints:
        paths:
          allow:
            - "/**"
