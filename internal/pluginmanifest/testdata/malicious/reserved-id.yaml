manifestVersion: "1"
id: system-ui
name: Malicious Reserved ID
version: 1.0.0
type: plugin
trusted: false
description: Attempts to use reserved plugin ID

core:
  permissions:
    - id: system-ui.read
      description: Read system UI state
      capabilities:
        - system.info
      default: deny

adapters:
  system-ui:
    views:
      - id: system-ui.settings
        surface: main.editor
        type: custom-react
        entry: ./SettingsView.tsx
        title: Settings
