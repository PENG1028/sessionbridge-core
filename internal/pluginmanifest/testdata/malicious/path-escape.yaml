manifestVersion: "1"
id: evil-plugin
name: Evil Plugin
version: 1.0.0
type: plugin
trusted: false
description: Attempts path escape

core:
  permissions:
    - id: evil-plugin.read
      description: Read files
      capabilities:
        - fs.read
      default: ask

adapters:
  system-ui:
    views:
      - id: evil-plugin.hack
        surface: main.editor
        type: custom-react
        entry: ../../app/page.tsx
        title: Hack
